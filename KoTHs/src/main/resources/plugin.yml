name: CosmicKOTH
main: com.compilex.CosmicKOTH.CosmicKOTHPlugin
version: 1.0
softdepend: [WorldGuard, WorldEdit, Essentials]
load: postworld
commands:
  koth:
    description: Display information regarding ongoing or upcoming KOTH events.
    usage: /<command>
  akoth:
    description: Admin KOTH command.
    usage: /<command>
  stronghold:
    description: Outpost command
    aliases: [citadel, strongholds, sh]
  outposts:
    description: View information about Cosmic Outposts.
    aliases: [outpost, o]
  aoutposts:
    description: Admin command.
    aliases: [aoutpost]
