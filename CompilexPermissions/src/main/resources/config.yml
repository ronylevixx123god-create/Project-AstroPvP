# Whether or not the plugin should send packets to servers telling them to reload a given player's permissions if the player is online.
SYNC_PERMISSION_CHANGES: false

# The server name as defined in the web config to load permissions for.
SERVER_NAME: server_name

# Download player permissions from all servers listed here as well as SERVER_NAME on login.
SHARED_PERMISSIONS:
  - hub_world
  - minigames

# The location of the web groups configuration.
WEB_GROUP_CONFIG_URL: 'https://www.arkhamnetwork.org/PermissionsConfig.yml'

DATABASE:
  HOST: localhost
  PORT: 3306
  USER: root
  PASS: ''
  DATABASENAME: permissions

# Whether or not to load ALL groups from ALL servers into memory along with their associated permission nodes.
LOAD_ALL_GROUPS: false

# Whether or not this plugin should run in API mode (non-interactive)
API_MODE: false
